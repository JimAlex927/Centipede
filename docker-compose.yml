services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: centipede
      POSTGRES_PASSWORD: centipede_dev
      POSTGRES_DB: centipede
    ports:
      - "5434:5432"
    volumes:
      - centipede_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centipede -d centipede"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  centipede_postgres_data:
