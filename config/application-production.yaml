server:
  address: ":7788"
  public_url: "CHANGE_ME"
  # Set this to the exact origin(s) serving apps/client, for example:
  # cors_origins: ["https://docs.example.com"]
  cors_origins: []
  read_header_timeout: "5s"
  read_timeout: "20s"
  write_timeout: "20s"
  idle_timeout: "60s"
  shutdown_timeout: "10s"

database:
  url: "CHANGE_ME"
  max_connections: 30
  min_connections: 5

auth:
  jwt_secret: "CHANGE_ME"
  access_token_ttl: "15m"
  refresh_token_ttl: "720h"
  refresh_cookie: "centipede_refresh"
  cookie_secure: true

license:
  # Set this separately from auth.jwt_secret and use the same value with
  # cmd/license when issuing self-hosted licenses.
  signing_secret: ""

mail:
  from: ""
  host: ""
  port: 587
  username: ""
  password: ""
  tls_mode: "starttls"

storage:
  # Match Docmost Node's local storage layout.
  data_dir: "./data/storage"
  max_upload_bytes: 104857600

collaboration:
  # Keep recently visited page documents warm while bounding memory usage.
  room_idle_timeout: "5m"
  max_resident_rooms: 256
  persist_coalesce_window: "2s"
  persist_coalesce_max_wait: "10s"

# Optional OpenAI-compatible AI provider. Set embedding_model to enable the
# asynchronous semantic index; keyword search remains the fallback.
# ai:
#   base_url: "https://api.openai.com/v1"
#   chat_model: "gpt-4o-mini"
#   completion_model: "gpt-4o-mini"
#   embedding_model: "text-embedding-3-small"
#   vector_driver: "postgres"
#   timeout: "60s"

# Optional scanned-PDF OCR. Leave both command paths empty to keep OCR disabled.
# pdf_ocr:
#   tesseract_path: "tesseract"
#   pdftoppm_path: "pdftoppm"
#   language: "eng"
#   timeout: "2m"
#   max_pages: 32

sso:
  issuer_url: "CHANGE_ME"
  client_id: "centipede.web"
  redirect_url: "CHANGE_ME"
  scopes: ["openid", "profile", "email"]

migration:
  legacy_base_url: ""
  # Set to the public origin serving the separately deployed frontend.
  frontend_base_url: ""
