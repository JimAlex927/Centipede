server:
  address: ":7788"
  public_url: "http://localhost:7788"
  # Keep the local Vite dev/preview ports and the VM address used for browser testing.
  # Credentialed requests require explicit origins; do not replace this with '*'.
  cors_origins:
    - "http://localhost:5173"
    - "http://localhost:4173"
    - "http://localhost:8080"
    - "http://localhost:3000"
    - "http://127.0.0.1:5173"
    - "http://127.0.0.1:4173"
    - "http://192.168.154.128:5173"
    - "http://192.168.154.128:4173"
    - "http://192.168.154.128:3000"
  read_header_timeout: "5s"
  read_timeout: "20s"
  write_timeout: "20s"
  idle_timeout: "60s"
  shutdown_timeout: "10s"

database:
  url: "postgres://centipede:centipede_dev@192.168.154.128:5433/centipede?sslmode=disable"
  max_connections: 10
  min_connections: 2

auth:
  jwt_secret: "dev-only-change-me-please"
  access_token_ttl: "15m"
  refresh_token_ttl: "720h"
  refresh_cookie: "centipede_refresh"
  cookie_secure: false

license:
  # Optional dedicated HMAC key for self-hosted license signing. If omitted,
  # the backend falls back to auth.jwt_secret for backward compatibility.
  signing_secret: ""

mail:
  # Example for Mailpit/MailHog: host 127.0.0.1, port 1025, tls_mode none.
  from: "Docmost <noreply@localhost>"
  host: ""
  port: 1025
  username: ""
  password: ""
  tls_mode: "none"

storage:
  # Match Docmost Node's local storage layout. Existing Centipede data/ files
  # are still read as a compatibility fallback by the Go storage adapter.
  data_dir: "./data/storage"
  max_upload_bytes: 104857600

collaboration:
  # Keep recently visited page documents in memory so a page switch does not
  # reload and rebuild the Yjs document from PostgreSQL.
  room_idle_timeout: "5m"
  max_resident_rooms: 256
  # Merge bursts of editor updates before writing the durable page projection.
  persist_coalesce_window: "2s"
  persist_coalesce_max_wait: "10s"

# Optional OpenAI-compatible AI provider. Credentials can also be supplied in .env.
# ai:
#   base_url: "http://127.0.0.1:11434/v1"
#   chat_model: "llama3.2"
#   completion_model: "llama3.2"
#   embedding_model: "nomic-embed-text"
#   vector_driver: "postgres"
#   timeout: "60s"

# Optional scanned-PDF OCR. Leave both command paths empty to keep OCR disabled.
# pdf_ocr:
#   tesseract_path: "tesseract"
#   pdftoppm_path: "pdftoppm"
#   language: "eng"
#   timeout: "2m"
#   max_pages: 32

sso:
  issuer_url: "http://localhost:7777"
  client_id: "centipede.web"
  redirect_url: "http://localhost:7788/oauth/callback"
  scopes: ["openid", "profile", "email"]

migration:
  # Point this at the current Docmost Node service while endpoints are migrated.
  legacy_base_url: ""
  # Public URL of the separately deployed frontend, used in invitation/reset links.
  frontend_base_url: "http://localhost:5173"
